# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ========== 🚀 编译速度优化 ==========

# 单 JVM 构建：Kotlin 编译改在 Gradle 进程内执行（见下方
# kotlin.compiler.execution.strategy=in-process），不再另起 Kotlin daemon。
#
# 实测（16 核 / 32GB，:app:assembleRelease --rerun-tasks）：
#   双进程（旧）   峰值 11.5GB（Gradle 5.0G + Kotlin 6.9G 并存），墙钟 507s
#   单进程 8G      峰值  8.2GB，墙钟 535s
#   单进程 8G + 8w 峰值  8.1GB，墙钟 437s   ← 当前配置
# 峰值降约 30%，墙钟降约 14%。代价是 Kotlin 与 R8/DEX 共享同一堆。
#
# -XX:+UseParallelGC: 保留吞吐量优先的垃圾回收器
# -XX:MaxMetaspaceSize=1g: 给元空间设上限，避免其无界增长被误认为堆泄漏；
#   实测本工程元空间峰值远低于 1G，若遇到 Metaspace OOM 再上调。
# -Xlog:gc=info,gc+heap=info: GC 事件和回收前后堆占用写入 JVM 标准输出，
#   可在 Gradle daemon 日志中查看（上游 v0.7.0 引入，用于观察内存峰值）。
# 水平类合并沿用 R8 默认开启；视频卡片的已知异常文件类仅在 app 保留规则中隔离。
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Xlog:gc=info,gc+heap=info -Dfile.encoding=UTF-8

# 🔥 启用并行编译 - 多模块时效果显著
org.gradle.parallel=true

# 并发任务数。上游 v0.7.0 为 16GB 开发机把该值降到 2；本机 16 核 / 32GB，
# 且已改用单 JVM（Kotlin 不再独立占堆），实测 8 个 worker 峰值仍只有 8.1GB，
# 故保留 8。该参数不等于 R8 内部线程数；内存紧张时降到 4 或 2。
org.gradle.workers.max=8

# 🔥 启用配置缓存 - 缓存配置阶段，增量编译更快
org.gradle.configuration-cache=true

# 配置缓存仍启用；配置阶段先顺序执行，避免多个模块同时配置放大内存峰值。
org.gradle.configuration-cache.parallel=false

# 🔥 启用构建缓存 - 缓存编译输出，跨构建复用
org.gradle.caching=true

# 🔥 文件系统监听 - 提升重复构建时的变更检测速度
org.gradle.vfs.watch=true

# ⚠️ 在配置缓存已经开启的前提下，按需配置收益很小，且更容易放大
# Kotlin/KSP 首次重建时的边缘问题，这里关闭以换取更稳定的本地编译体验。
org.gradle.configureondemand=false

# ========== Kotlin 优化 ==========

# 🔥 Kotlin 增量编译
kotlin.incremental=true

# 关键：让 Kotlin 编译跑在 Gradle 进程内，不再单独拉起 Kotlin daemon。
# 这是本仓库内存优化的核心 —— 旧配置下 Gradle(4G) 与 Kotlin daemon(6G)
# 会同时驻留，实测峰值 11.5GB；改为 in-process 后只有一个 JVM，峰值 8.1GB。
#
# 注意：in-process 时 Kotlin 用的是 org.gradle.jvmargs 的堆，所以上面必须给到 8g。
# 曾试过 in-process + 4g，会直接 OOM：
#   java.lang.OutOfMemoryError: GC overhead limit exceeded
#   at FastMethodAnalyzer._init_$lambda$0
# 若改回双进程模式（strategy=daemon），需同时恢复 kotlin.daemon.jvmargs，
# 并把 org.gradle.jvmargs 降回 4g 左右，否则两个堆相加会超出物理内存。
kotlin.compiler.execution.strategy=in-process

# 🔥 KSP 增量处理 - Room 等注解处理器在小改动时可少做很多重复工作
ksp.incremental=true
ksp.incremental.intermodule=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ========== Android 优化 ==========

# AndroidX package structure
android.useAndroidX=true


# 🔥 非传递 R 类 - 减少 R 类大小
android.nonTransitiveRClass=true

# ========== Firebase 优化 ==========

# 本地默认不上传；正式发布流程显式传入 -Pbili.firebase.uploadMapping=true。
bili.firebase.uploadMapping=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
